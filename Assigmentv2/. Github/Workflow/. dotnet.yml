# Weaver CyberSecurity Awareness Bot

## Overview

The **Weaver CyberSecurity Awareness Bot** is a C# console application designed to educate users on basic cybersecurity practices such as password safety, phishing awareness, and safe browsing.

This project demonstrates modular programming, user interaction, and decision-making using simple chatbot logic.

---

## How the Program Works (Step-by-Step)

---

### 1. Entry Point (`Program.cs`)

This is where everything begins. It controls the full workflow of the application.

```csharp
using CyberSecurityChatbot;
using System;
using WeaverSecurityChatbot;

class Program
{
    static void Main()
    {
        Console.Clear(); // Clears console for clean UI

        VoiceGreeting.PlayGreeting(); // Plays audio greeting

        AsciiArt.ShowLogo(); // Displays ASCII logo

        string name = UserInteraction.AskName(); // Gets user name

        UserInteraction.WelcomeUser(name); // Welcomes user

        ChatBot bot = new ChatBot(); // Create chatbot object
        bot.StartChat(name); // Start chatbot loop
    }
}
```

**Explanation:**

* Controls the sequence of execution
* Connects all other classes together
* Acts as the central controller of the application

---

### 2. Audio Greeting (`VoiceGreeting.cs`)

Plays a welcome sound when the program starts.

```csharp
using System;
using System.IO;
using System.Media;

namespace CyberSecurityChatbot
{
    public class VoiceGreeting
    {
        public static void PlayGreeting()
        {
            try
            {
                string path = Path.Combine(AppDomain.CurrentDomain.BaseDirectory, "Audio", "ttsmp3_1773313990040.wav");

                SoundPlayer player = new SoundPlayer(path);
                player.PlaySync(); // Plays audio synchronously
            }
            catch
            {
                Console.WriteLine("Audio greeting could not be played.");
            }
        }
    }
}
```

**Explanation:**

* Loads `.wav` file from the project directory
* Uses `SoundPlayer` to play audio
* Includes error handling if file is missing

