### 4. User Interaction (`UserInteraction.cs`)

Handles user input and validation.

```csharp
using System;

namespace CyberSecurityChatbot
{
    public class UserInteraction
    {
        public static string AskName()
        {
            Console.Write("Enter your name: ");
            string name = Console.ReadLine();

            while (string.IsNullOrWhiteSpace(name))
            {
                Console.Write("Name cannot be empty. Please enter your name: ");
                name = Console.ReadLine();
            }

            return name;
        }

        public static void WelcomeUser(string name)
        {
            Console.ForegroundColor = ConsoleColor.Green;
            Console.WriteLine($"\nWelcome {name}!");
            Console.WriteLine("I am the Weaversecurity Awareness Bot.");
            Console.WriteLine("You can ask me about passwords, phishing, and safe browsing.");
            Console.ResetColor();
        }
    }
}
```

**Explanation:**

* Ensures user enters valid input
* Personalizes experience using their name

---

### 5. Chatbot Logic (`ChatBot.cs`)

This is the core of your chatbot.

```csharp
using System;

namespace WeaverSecurityChatbot
{
    public class ChatBot
    {
        public void StartChat(string name)
        {
            while (true) // Infinite loop until exit
            {
                Console.Write("\nAsk a question (type 'exit' to quit): ");
                string input = Console.ReadLine().ToLower();

                if (string.IsNullOrWhiteSpace(input))
                {
                    Console.WriteLine("Please enter a valid question.");
                }
                else if (input.Contains("how are you"))
                {
                    Console.WriteLine("I'm running smoothly and ready to help!");
                }
                else if (input.Contains("purpose"))
                {
                    Console.WriteLine("My purpose is to help you understand cybersecurity.");
                }
                else if (input.Contains("password"))
                {
                    Console.WriteLine("Use strong passwords with numbers, symbols, and uppercase letters.");
                }
                else if (input.Contains("phishing"))
                {
                    Console.WriteLine("Phishing is when attackers trick you into giving personal information through fake emails or websites.");
                }
                else if (input.Contains("safe browsing"))
                {
                    Console.WriteLine("Always check website URLs and avoid clicking suspicious links.");
                }
                else if (input.Contains("exit"))
                {
                    Console.WriteLine($"Goodbye {name}! Stay safe online.");
                    break; // Exit loop
                }
                else
                {
                    Console.WriteLine("I didn't quite understand that. Could you rephrase?");
                }
            }
        }
    }
}
```

**Explanation:**

* Uses a loop to keep conversation running
* Converts input to lowercase for easier matching
* Uses if-else for keyword detection
* Ends when user types "exit"

